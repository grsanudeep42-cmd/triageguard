# redflags.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 3 – Clinical red-flag text patterns for TriageGuard.
#
# PURPOSE
# --------
# Each red flag is matched against the CLEANED complaint text using fuzzy
# word-level matching (Levenshtein distance ≤ 2 per token).
# A matched red flag escalates the patient to AT MOST level 2
# (never to level 1, which requires confirmed vital signs).
#
# INDEPENDENCE
# ------------
# These phrase lists are written independently from the data generator's
# lexicon.yaml.  Do NOT share or copy generator phrase pools into this file.
#
# LANGUAGE NOTES
# ---------------
# - patterns_en    : English
# - patterns_tel   : Telugu written in English letters (romanised)
# - patterns_hin   : Hindi written in English letters (romanised)
# Phrases are intentionally SHORT (1–3 key words) so the fuzzy matcher
# can catch common spelling mistakes (e.g. "seziure" → "seizure").
#
# SOURCE: PLACEHOLDER pending official triage primer
# ─────────────────────────────────────────────────────────────────────────────

fuzzy_max_distance: 2   # Levenshtein distance per token  # PLACEHOLDER

red_flags:

  - id: RF001
    name: chest_pain
    escalate_to_max_level: 2
    patterns_en:
      - "chest pain"
      - "chest tightness"
      - "chest pressure"
      - "chest crushing"
      - "heart pain"
    patterns_tel:
      - "gunde noppi"
      - "chest noppi"
      - "gundelo noppi"
    patterns_hin:
      - "seene dard"
      - "chhati dard"
      - "seene mein dard"

  - id: RF002
    name: breathlessness
    escalate_to_max_level: 2
    patterns_en:
      - "cannot breathe"
      - "difficulty breathing"
      - "breathlessness"
      - "shortness of breath"
      - "not breathing"
      - "unable to breathe"
    patterns_tel:
      - "oopiri ledu"
      - "oopiri tesukovadam ledu"
      - "breath ledu"
    patterns_hin:
      - "saans nahi"
      - "saans nahi aa"
      - "dam ghut"

  - id: RF003
