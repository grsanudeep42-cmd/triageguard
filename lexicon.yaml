# lexicon.yaml
# Telugu (written in English letters – Romanised Telugu) and Hindi (written in
# English letters – Romanised Hindi) complaint phrases for TriageGuard.
#
# PURPOSE: A native Telugu or Hindi speaker can review and edit ONLY this file
# to improve linguistic authenticity without touching any model code.
#
# RULES:
#   - Phrases are colloquial and simple. No invented medical claims.
#   - All phrases are SYNTHETIC and NOT clinically validated.
#   - Keys under "archetypes:" must exactly match the "name" field in archetypes.yaml.
#
# PLACEHOLDER: All phrase selections and style probabilities are placeholders.
# A sociolinguist familiar with Andhra/Telangana/Hindi-belt OPD speech should
# validate before any real deployment.

# ── Generic duration suffixes ──────────────────────────────────────────────
duration:
  telugu:
    - "2 rojulu nundi"
    - "ninna nundi"
    - "ee roju subah nundi"
    - "3 ghantalu nundi"
    - "oka varam nundi"
    - "chinna pachchi nundi"
    - "rendhu rojulu nundi"
    - "morning nundi"
  hindi:
    - "2 din se"
    - "kal se"
    - "aaj subah se"
    - "3 ghante se"
    - "1 hafte se"
    - "thodi der se"
    - "subah se hai"
    - "2 ghante se"
  english:
    - "since yesterday"
    - "since this morning"
    - "since 2 days"
    - "since last night"
    - "for about 3 hours"
    - "from morning"
    - "since 2 days nundi"
    - "since morning only"

# ── Mild / vague phrases  (used for emergency under-reporting bias) ─────────
# PLACEHOLDER – must be reviewed so they genuinely sound like under-reporting
mild_phrases:
  telugu:
    - "koddiga uncomfortable ga vundi"
    - "mild ga noppi unnadi oka sari chudamani vacham"
    - "thoda uneasiness ga undi emi kaadu anukuntunna"
    - "chinna samasya ani vachham"
    - "emi serious kaadu anukuntunna koddiga feel avutundi"
  hindi:
    - "thoda dard hai kuch zyada nahi"
    - "halka sa dard hai check karna tha"
    - "thodi takleef hai serious nahi lagti"
    - "kuch theek nahi lag raha bas dekhna tha"
    - "halki si taklif chal rahi hai"
  english:
    - "mild discomfort since morning nothing serious"
    - "not feeling great just wanted to get checked"
    - "slight uneasiness nothing major doctor"
    - "just a small problem wanted to check"
    - "feeling a bit off not too bad"

# ── Dramatic / exaggerated phrases  (used for mild over-reporting bias) ─────
# PLACEHOLDER – must be reviewed for authenticity
dramatic_phrases:
  telugu:
    - "chala theevranga noppi vestondi maravaledhu doctor"
    - "chala bhayam ga vundi oka sari chudandi please"
    - "chala kashttam ga vundi ee noppi thalapaledu"
    - "urgent ga chudu doctor ikkade pothanu"
  hindi:
    - "bahut zyada dard hai bardasht nahi ho raha doctor sahab"
    - "bahut bura lag raha main abhi gir jaaunga"
    - "please jaldi dekhiye bahut takleef hai"
    - "emergency hai doctor ek pal bhi nahi ruk sakta"
  english:
    - "unbearable pain please see me immediately"
    - "very very severe I cannot take it any more doctor"
    - "emergency please I am extremely sick"
    - "please urgent I feel like I will collapse"

